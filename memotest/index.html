<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memotest - Mini Arcade</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/home.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#x1F0CF;</text></svg>">
</head>
<body>
    <!-- Auth Navbar (shared) -->
    <nav class="auth-nav">
        <div class="auth-nav-inner">
            <a href="../index.html" class="nav-logo">Mini Arcade</a>
            <div class="auth-nav-actions">
                <button id="auth-btn" class="nav-auth-btn glass-sm">Ingresar</button>
                <div id="user-menu" class="user-menu" style="display:none;">
                    <button id="user-menu-btn" class="user-menu-btn glass-sm">
                        <span id="username-display" class="username-text">Usuario</span>
                    </button>
                    <div id="user-dropdown" class="user-dropdown glass-sm">
                        <button id="logout-btn" class="dropdown-item">Cerrar Sesion</button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- Auth Modal (shared) -->
    <div id="auth-modal" class="overlay glass-dark">
        <div class="auth-modal glass">
            <button id="auth-close" class="auth-close">&times;</button>
            <div id="auth-success" class="auth-success" style="display:none;">
                <div class="auth-success-icon">&#x2705;</div>
                <p id="auth-success-msg"></p>
            </div>
            <div id="auth-tabs" class="auth-tabs">
                <button id="btn-tab-login" class="auth-tab active">Ingresar</button>
                <button id="btn-tab-register" class="auth-tab">Registrarse</button>
            </div>
            <form id="form-login" class="auth-form">
                <div class="auth-error" id="login-error" style="display:none;"></div>
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" placeholder="tu@email.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="login-password">Contrasena</label>
                    <input type="password" id="login-password" placeholder="Tu contrasena" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn btn-primary auth-submit">Ingresar</button>
                <div class="auth-divider"><span>o</span></div>
                <button type="button" id="btn-google-login" class="btn btn-google">
                    <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Iniciar sesion con Google
                </button>
            </form>
            <form id="form-register" class="auth-form" style="display:none;">
                <div class="auth-error" id="register-error" style="display:none;"></div>
                <div class="form-group">
                    <label for="register-email">Email</label>
                    <input type="email" id="register-email" placeholder="tu@email.com" autocomplete="email" required>
                </div>
                <div class="form-group">
                    <label for="register-username">Usuario <span class="optional">opcional</span></label>
                    <input type="text" id="register-username" placeholder="Tu nombre de usuario" autocomplete="username" maxlength="20">
                </div>
                <div class="form-group">
                    <label for="register-password">Contrasena</label>
                    <input type="password" id="register-password" placeholder="Minimo 6 caracteres" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <label for="register-confirm">Confirmar contrasena</label>
                    <input type="password" id="register-confirm" placeholder="Repeti la contrasena" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary auth-submit">Crear Cuenta</button>
                <div class="auth-divider"><span>o</span></div>
                <button type="button" id="btn-google-register" class="btn btn-google">
                    <svg class="google-icon" viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                    Registrarse con Google
                </button>
            </form>
        </div>
    </div>

    <div id="app">
        <!-- Pantalla de inicio -->
        <div id="start-screen" class="screen active">
            <div class="start-content glass">
                <h1 class="game-title">Memotest</h1>
                <p class="game-subtitle">Pone a prueba tu memoria</p>
                <div class="difficulty-selection">
                    <span class="difficulty-label">Elegi dificultad:</span>
                    <div class="difficulty-buttons">
                        <button class="diff-btn active" data-diff="easy">
                            <span class="diff-name">Facil</span>
                            <span class="diff-size">4x3</span>
                        </button>
                        <button class="diff-btn" data-diff="normal">
                            <span class="diff-name">Normal</span>
                            <span class="diff-size">4x4</span>
                        </button>
                        <button class="diff-btn" data-diff="hard">
                            <span class="diff-name">Dificil</span>
                            <span class="diff-size">5x4</span>
                        </button>
                        <button class="diff-btn" data-diff="expert">
                            <span class="diff-name">Experto</span>
                            <span class="diff-size">6x4</span>
                        </button>
                    </div>
                </div>
                <div class="start-menu">
                    <button id="btn-new-game" class="btn btn-primary">Jugar</button>
                </div>
                <div class="high-score-display">
                    <span>Mejor Puntuacion:</span>
                    <span id="high-score-value">--</span>
                </div>
            </div>
        </div>

        <!-- Pantalla de juego -->
        <div id="game-screen" class="screen">
            <!-- Title bar -->
            <div class="game-title-bar">
                <a href="../index.html" class="back-link" title="Volver al inicio">&larr;</a>
                <span class="logo">Memotest</span>
                <span id="diff-badge" class="level-badge">FACIL</span>
            </div>

            <!-- Stats -->
            <header class="game-header glass-sm">
                <div class="header-item">
                    <span class="header-label">Movimientos</span>
                    <span id="moves-count" class="header-value">0</span>
                </div>
                <div class="header-item">
                    <span class="header-label">Pares</span>
                    <span id="pairs-found" class="header-value">0/6</span>
                </div>
                <div class="header-item">
                    <span class="header-label">Tiempo</span>
                    <span id="timer-display" class="header-value">0:00</span>
                </div>
            </header>

            <!-- Tablero de juego -->
            <div id="game-board" class="game-board glass-sm"></div>

            <!-- Footer -->
            <div class="game-footer">MEMOTEST - MINI ARCADE</div>
        </div>

        <!-- Overlay de victoria -->
        <div id="win-overlay" class="overlay glass-dark">
            <div class="overlay-content glass">
                <div id="stars-display" class="stars-display"></div>
                <h2>Felicitaciones!</h2>
                <div class="level-stats">
                    <p>Movimientos: <span id="final-moves">0</span></p>
                    <p>Tiempo: <span id="final-time">0:00</span></p>
                    <p>Puntuacion: <span id="final-score">0</span></p>
                </div>
                <button id="btn-play-again" class="btn btn-primary">Jugar de Nuevo</button>
                <button id="btn-back-menu" class="btn btn-secondary">Menu Principal</button>
            </div>
        </div>
    </div>

    <!-- Supabase SDK (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- App Scripts -->
    <script src="../js/supabase-client.js"></script>
    <script src="../js/auth.js"></script>
    <!-- Game Script -->
    <script src="game.js"></script>
</body>
</html>
